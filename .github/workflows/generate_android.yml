name: Generate Android Folder

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      
      - name: Generate official Android folder
        run: |
          flutter create --org com.apex.index temp_project
          cp -r temp_project/android .
          rm -rf temp_project
      
      - name: Ensure applicationId is com.apex.index
        run: |
          sed -i 's/com.apex.index_project/com.apex.index/g' android/app/build.gradle
          sed -i 's/com.apex.index_project/com.apex.index/g' android/app/build.gradle.kts 2>/dev/null || true
      
      - uses: actions/upload-artifact@v4
        with:
          name: android-folder
          path: android/
